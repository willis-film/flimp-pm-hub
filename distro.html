<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Distribution Generator — Frequency Tower</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<!-- main.css first: it owns the design tokens, the topbar, .btn, and the whole
     .ds-* wizard/preview block, all reused here. distro-page.css adds only what
     this page needs on top — see its header comment. -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/distro-page.css">
</head>
<body class="dsp-body">

<!-- CONSOLE BEZEL — the hub's topbar, minus the controls that need a board. -->
<div class="topbar">
  <div class="brand-cluster">
    <img src="https://willis-film.github.io/flimp-pm-hub/frequency-tower-logo.png" alt="Frequency Tower" class="brand-logo">
    <span class="brand-divider"></span>
    <span class="brand-tag">Distribution Generator</span>
  </div>
  <div class="topbar-right">
    <a class="btn btn-ghost btn-sm" href="index.html">Project Control</a>
  </div>
</div>

<div class="dsp-wrap">
  <div class="dsp-head">
    <div class="dsp-title-wrap">
      <span class="dsp-eyebrow">Client Email</span>
      <div class="dsp-title">Build a distribution email</div>
      <div class="dsp-sub">
        Standalone — this page holds no project data. Name the deliverables and paste
        the links yourself, and it assembles the client-ready email: options renumbered,
        every internal instruction stripped.
      </div>
    </div>
    <div class="dsp-actions">
      <button class="btn btn-ghost btn-sm" onclick="DS.reset()">Clear draft</button>
    </div>
  </div>

  <!-- The wizard + live preview mount here; everything inside is generated by
       js/distro-page.js, which also owns the inline on* handlers via window.DS. -->
  <div id="distro-root"></div>
</div>

<!-- Copy confirmation. The hub uses A.toast(); this page carries its own. -->
<div class="ds-flash" id="ds-flash"></div>

<!-- No bus, no store, no Alpine — one self-contained script with no imports.
     DELIBERATELY NOT type="module", unlike the hub's entry point. A module is
     fetched under CORS rules, and a file:// page has a null origin, so the
     browser refuses to load it and the page renders as a header above a blank
     space. This script imports nothing, so module mode bought it nothing and
     cost it the ability to be opened by double-clicking the file. As a plain
     script it runs from file:// and from a server alike. Keep it that way:
     adding an `import` here re-breaks local opening. -->
<script src="js/distro-page.js"></script>
</body>
</html>
